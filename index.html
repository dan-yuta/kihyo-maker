<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>起票メーカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>起票メーカー</h1>
    <p class="lead">テンプレートを選んで答えると、Backlog に貼る件名と詳細ができます。</p>
  </header>

  <main class="main">
    <section class="card">
      <label class="field">
        <span class="field-label">テンプレート</span>
        <select id="templateSelect"></select>
      </label>
      <div id="questions" class="questions"></div>
      <div class="buttons">
        <button id="fillButton" type="button" class="button button-primary">型どおりに埋める</button>
        <!-- あとで「AI で整える」ボタンをここに足す -->
        <span id="aiButtonSlot"></span>
      </div>
    </section>

    <section class="card" id="result" hidden>
      <div class="result-block">
        <div class="result-head">
          <h2>件名</h2>
          <button type="button" class="button button-small copy-button" data-target="titleOutput">コピー</button>
        </div>
        <pre id="titleOutput" class="output output-title"></pre>
      </div>
      <div class="result-block">
        <div class="result-head">
          <h2>詳細</h2>
          <button type="button" class="button button-small copy-button" data-target="bodyOutput">コピー</button>
        </div>
        <pre id="bodyOutput" class="output"></pre>
      </div>
      <div class="result-block">
        <h2>Backlog の欄に入れる物</h2>
        <dl class="backlog-fields">
          <dt>種別</dt><dd id="typeOutput"></dd>
          <dt>期限日</dt><dd id="dueOutput"></dd>
        </dl>
      </div>
    </section>
  </main>

  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <script src="templates.js"></script>
  <script src="script.js"></script>
</body>
</html>
